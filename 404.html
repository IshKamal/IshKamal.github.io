<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page Not Found | Ishmam Kamal</title>
<meta name="robots" content="noindex">
<!--
  This page is intentionally self-contained (inline CSS, no external assets).
  GitHub Pages can serve 404.html for a broken URL at any depth, so relative
  paths to /assets/... are not reliable here. This repo (ishmamkamal.github.io)
  does not exactly match the account login (IshKamal), so GitHub serves it as
  a project site at /ishmamkamal.github.io/ rather than the bare root. The
  "Back to homepage" link below is hardcoded to that path. If the repo is
  later renamed to IshKamal.github.io for root hosting, change the href
  below from "/ishmamkamal.github.io/" to "/".
-->
<style>
  :root {
    --color-bg: #faf9f5;
    --color-text: #1b2430;
    --color-text-muted: #4b5563;
    --color-accent: #0f766e;
    --color-accent-strong: #0b5c56;
    --color-border: #e2ddd0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --color-bg: #10161b;
      --color-text: #edf0f2;
      --color-text-muted: #a9b3bc;
      --color-accent: #38b2a3;
      --color-accent-strong: #6cd4c6;
      --color-border: #2b343c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--color-bg);
    color: var(--color-text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    text-align: center;
    padding: 2rem;
  }
  .wrap { max-width: 34rem; }
  .code {
    font-size: clamp(3rem, 8vw, 5rem);
    font-weight: 800;
    color: var(--color-accent);
    margin: 0 0 0.5rem;
    letter-spacing: -0.03em;
  }
  h1 { font-size: 1.5rem; margin: 0 0 0.75rem; }
  p { color: var(--color-text-muted); line-height: 1.6; margin: 0 0 1.75rem; }
  a.btn {
    display: inline-block;
    background: var(--color-accent);
    color: #fff;
    text-decoration: none;
    font-weight: 600;
    padding: 0.75em 1.6em;
    border-radius: 10px;
  }
  a.btn:hover { background: var(--color-accent-strong); }
  a.btn:focus-visible { outline: 3px solid var(--color-accent); outline-offset: 3px; }
</style>
</head>
<body>
  <main class="wrap">
    <p class="code" aria-hidden="true">404</p>
    <h1>Page not found</h1>
    <p>The page you're looking for doesn't exist or may have moved. Let's get you back to Ishmam Kamal's portfolio.</p>
    <a class="btn" href="/ishmamkamal.github.io/">Back to homepage</a>
  </main>
</body>
</html>
